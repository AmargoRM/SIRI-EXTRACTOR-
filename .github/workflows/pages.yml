# Publica la carpeta web/ en GitHub Pages.
# Requiere una sola vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar página web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Dos trabajos separados (como la plantilla oficial de GitHub): si "deploy" corre en el
  # mismo trabajo justo después de subir el paquete, a veces GitHub todavía no lo ve
  # ("No artifacts named github-pages") y la publicación falla.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
